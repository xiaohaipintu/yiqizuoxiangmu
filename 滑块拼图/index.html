<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="滑块拼图 · 小海平顶" />
<title>拼图 · 小海平顶</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f172a;
    --panel: #1e293b;
    --line: #334155;
    --text: #e2e8f0;
    --dim: #94a3b8;
    --accent1: #38bdf8;
    --accent2: #6366f1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 700px at 50% -15%, #1e293b 0%, var(--bg) 62%) fixed;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  .app {
    /* 棋盘边长：同时受宽度和高度限制，手机上不会溢出屏幕 */
    --board: min(92vw, 56vh, 460px);
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  @supports (height: 100dvh) {
    .app { --board: min(92vw, 56dvh, 460px); }
  }

  header { text-align: center; }
  h1 {
    margin: 0;
    font-size: clamp(1.25rem, 5.2vw, 1.75rem);
    letter-spacing: .06em;
    background: linear-gradient(120deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { margin: 2px 0 0; font-size: .76rem; color: var(--dim); }

  .stats { display: flex; gap: 8px; width: 100%; }
  .stat {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px 4px;
    text-align: center;
    line-height: 1.25;
  }
  .stat b {
    display: block;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
  }
  .stat em { font-style: normal; font-size: .7rem; color: var(--dim); }

  .board-wrap {
    position: relative;
    width: var(--board);
    height: var(--board);
    border-radius: 18px;
  }
  .board {
    --n: 3;
    position: absolute;
    inset: 0;
    touch-action: none;
  }
  .board.no-anim .tile { transition: none; }
  .tile {
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% / var(--n));
    height: calc(100% / var(--n));
    transition: transform .13s ease-out;
    will-change: transform;
  }
  .tile .face {
    position: absolute;
    inset: 3px;
    border-radius: clamp(6px, 2.2vw, 12px);
    display: grid;
    place-items: center;
    overflow: hidden;
    background: linear-gradient(150deg, var(--accent1), var(--accent2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 3px 8px rgba(2,6,23,.45);
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
  }
  .tile .num {
    font-size: calc(var(--board) / var(--n) * 0.4);
    font-weight: 700;
    color: #fff;
    text-shadow: 0 2px 4px rgba(2,6,23,.45);
    font-variant-numeric: tabular-nums;
  }
  .board.pic .tile .num { display: none; }
  .board.pic .tile .face { box-shadow: 0 3px 8px rgba(2,6,23,.5); }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; justify-content: center; }
  .btn {
    min-height: 44px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
    font-size: .92rem;
    cursor: pointer;
    transition: transform .08s ease, filter .15s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary {
    border-color: transparent;
    background: linear-gradient(150deg, var(--accent1), var(--accent2));
    color: #fff;
    font-weight: 600;
  }
  .seg {
    display: flex;
    gap: 2px;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
  }
  .seg button {
    min-height: 38px;
    min-width: 54px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--dim);
    font-family: inherit;
    font-size: .88rem;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .seg button.on { background: var(--line); color: #fff; font-weight: 600; }

  .hint { margin: 0; font-size: .74rem; line-height: 1.5; color: #64748b; text-align: center; }

  .win {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    border-radius: 18px;
    background: rgba(15,23,42,.74);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    animation: fade .2s ease;
  }
  .win[hidden] { display: none; }
  .win-card {
    text-align: center;
    padding: 20px 26px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
    box-shadow: 0 22px 48px rgba(2,6,23,.6);
    animation: pop .26s cubic-bezier(.2,1.4,.5,1);
  }
  .win-card h2 {
    margin: 0 0 6px;
    font-size: 1.35rem;
    background: linear-gradient(120deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .win-card p { margin: 0 0 14px; font-size: .88rem; color: var(--dim); white-space: pre-line; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* 横屏矮屏（比如手机横放）时压缩留白 */
  @media (max-height: 620px) {
    .app { --board: min(84vw, 62vh, 380px); }
    .hint { display: none; }
    h1 { font-size: 1.1rem; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>拼图 · 小海平顶</h1>
    <p class="sub">把方块按 1→<span id="sub-max">8</span> 的顺序排好</p>
  </header>

  <div class="stats">
    <div class="stat"><b id="stat-moves">0</b><em>步数</em></div>
    <div class="stat"><b id="stat-time">0:00</b><em>用时</em></div>
    <div class="stat"><b id="stat-best">--</b><em>最佳</em></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" aria-label="拼图棋盘"></div>
    <div class="win" id="win" hidden>
      <div class="win-card">
        <h2>拼好了！</h2>
        <p id="win-detail"></p>
        <button class="btn primary" id="win-again" type="button">再来一局</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="seg" id="levels">
      <button type="button" data-n="3" class="on">3×3</button>
      <button type="button" data-n="4">4×4</button>
      <button type="button" data-n="5">5×5</button>
    </div>
    <button class="btn primary" id="btn-shuffle" type="button">重新打乱</button>
    <button class="btn" id="btn-mode" type="button">切图片</button>
  </div>

  <p class="hint">点空格旁边的方块，或直接滑动屏幕；电脑可用方向键</p>
</main>

<script>
(function () {
  'use strict';

  var boardEl = document.getElementById('board');
  var winEl = document.getElementById('win');
  var winDetail = document.getElementById('win-detail');
  var statMoves = document.getElementById('stat-moves');
  var statTime = document.getElementById('stat-time');
  var statBest = document.getElementById('stat-best');
  var levelsEl = document.getElementById('levels');
  var btnShuffle = document.getElementById('btn-shuffle');
  var btnMode = document.getElementById('btn-mode');
  var winAgain = document.getElementById('win-again');
  var subMax = document.getElementById('sub-max');

  var game = {
    n: 3,
    place: [],   // place[位置] = 数字，0 表示空格
    els: {},     // 数字 -> { el, face, num }
    blank: 0,
    moves: 0,
    t0: 0,
    tick: null,
    playing: false,
    done: false,
    pic: false,  // 是否图片模式
    imgSrc: ''
  };

  /* ---------- 内置图片（canvas 本地生成，不联网） ---------- */
  function buildPicture() {
    var size = 720;
    var cv = document.createElement('canvas');
    cv.width = cv.height = size;
    var g = cv.getContext('2d');

    var bg = g.createLinearGradient(0, 0, size, size);
    bg.addColorStop(0, '#0284c7');
    bg.addColorStop(0.45, '#4f46e5');
    bg.addColorStop(1, '#9333ea');
    g.fillStyle = bg;
    g.fillRect(0, 0, size, size);

    // 光斑
    for (var i = 0; i < 7; i++) {
      g.beginPath();
      g.arc(size * 0.26 + i * 34, size * 0.78 - i * 40, 55 + i * 46, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,255,255,' + (0.045 + i * 0.012).toFixed(3) + ')';
      g.fill();
    }
    // 斜纹
    g.save();
    g.globalAlpha = 0.07;
    g.strokeStyle = '#fff';
    g.lineWidth = 20;
    for (var x = -size; x < size * 2; x += 66) {
      g.beginPath();
      g.moveTo(x, 0);
      g.lineTo(x + size, size);
      g.stroke();
    }
    g.restore();
    // 文字
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = 'rgba(255,255,255,.94)';
    g.font = '700 ' + Math.round(size * 0.17) + 'px system-ui, "Microsoft YaHei", sans-serif';
    g.fillText('拼图', size / 2, size * 0.43);
    g.fillStyle = 'rgba(255,255,255,.72)';
    g.font = '500 ' + Math.round(size * 0.062) + 'px system-ui, "Microsoft YaHei", sans-serif';
    g.fillText('小海平顶', size / 2, size * 0.61);

    return cv.toDataURL('image/png');
  }

  /* ---------- 基础工具 ---------- */
  function total() { return game.n * game.n; }
  function bestKey() { return 'puzzle:best:' + game.n; }

  function fmt(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function elapsed() {
    return game.t0 ? Date.now() - game.t0 : 0;
  }

  function neighbours(i) {
    var n = game.n;
    var r = Math.floor(i / n);
    var c = i % n;
    var out = [];
    if (r > 0) out.push(i - n);
    if (r < n - 1) out.push(i + n);
    if (c > 0) out.push(i - 1);
    if (c < n - 1) out.push(i + 1);
    return out;
  }

  /* ---------- 渲染 ---------- */
  function render() {
    var n = game.n;
    for (var i = 0; i < n * n; i++) {
      var v = game.place[i];
      if (!v) continue;
      var rec = game.els[v];
      if (!rec) continue;
      var r = Math.floor(i / n);
      var c = i % n;
      rec.el.style.transform = 'translate(' + (c * 100) + '%,' + (r * 100) + '%)';
    }
  }

  function applyMode() {
    var n = game.n;
    boardEl.classList.toggle('pic', game.pic);
    for (var v = 1; v < n * n; v++) {
      var rec = game.els[v];
      if (!rec) continue;
      if (game.pic) {
        var p = v - 1;
        var r = Math.floor(p / n);
        var c = p % n;
        rec.face.style.backgroundImage = 'url("' + game.imgSrc + '")';
        rec.face.style.backgroundSize = (n * 100) + '% ' + (n * 100) + '%';
        rec.face.style.backgroundPosition =
          (c / (n - 1)) * 100 + '% ' + (r / (n - 1)) * 100 + '%';
      } else {
        rec.face.style.backgroundImage = '';
        rec.face.style.backgroundSize = '';
        rec.face.style.backgroundPosition = '';
      }
    }
  }

  /* ---------- 统计 / 计时 ---------- */
  function paintStats() {
    statMoves.textContent = String(game.moves);
    statTime.textContent = fmt(elapsed());
  }

  function startTimer() {
    if (game.tick) return;
    game.t0 = Date.now();
    game.tick = setInterval(paintStats, 200);
  }

  function stopTimer() {
    if (game.tick) {
      clearInterval(game.tick);
      game.tick = null;
    }
  }

  function showBest() {
    try {
      var raw = localStorage.getItem(bestKey());
      var b = raw ? JSON.parse(raw) : null;
      statBest.textContent = b && b.ms ? fmt(b.ms) : '--';
    } catch (e) {
      statBest.textContent = '--';
    }
  }

  function saveBest() {
    var ms = elapsed();
    var rec = { ms: ms, moves: game.moves };
    try {
      var raw = localStorage.getItem(bestKey());
      var old = raw ? JSON.parse(raw) : null;
      if (!old || !old.ms || ms < old.ms) {
        localStorage.setItem(bestKey(), JSON.stringify(rec));
        showBest();
        return true;
      }
    } catch (e) { /* 隐私模式等场景忽略 */ }
    return false;
  }

  /* ---------- 局面操作 ---------- */
  function swapWithBlank(i) {
    var b = game.blank;
    var v = game.place[i];
    game.place[i] = 0;
    game.place[b] = v;
    game.blank = i;
  }

  function isSolved() {
    var t = total();
    for (var i = 0; i < t - 1; i++) {
      if (game.place[i] !== i + 1) return false;
    }
    return game.place[t - 1] === 0;
  }

  function resetSolved() {
    var t = total();
    game.place = new Array(t).fill(0);
    for (var i = 0; i < t - 1; i++) game.place[i] = i + 1;
    game.blank = t - 1;
  }

  function buildTiles() {
    boardEl.innerHTML = '';
    game.els = {};
    boardEl.style.setProperty('--n', game.n);
    for (var v = 1; v < total(); v++) {
      var el = document.createElement('div');
      el.className = 'tile';
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', '方块 ' + v);
      el.dataset.value = String(v);

      var face = document.createElement('div');
      face.className = 'face';
      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(v);
      face.appendChild(num);
      el.appendChild(face);
      boardEl.appendChild(el);

      game.els[v] = { el: el, face: face, num: num };
    }
  }

  function shuffle() {
    winEl.hidden = true;
    game.done = false;
    game.playing = false;
    game.moves = 0;
    stopTimer();
    game.t0 = 0;

    resetSolved();

    // 从「已完成」状态随机走合法步数，保证一定有解
    var steps = total() * 24;
    var last = -1;
    for (var k = 0; k < steps; k++) {
      var nb = neighbours(game.blank).filter(function (i) { return i !== last; });
      var pick = nb[Math.floor(Math.random() * nb.length)];
      last = game.blank;
      swapWithBlank(pick);
    }
    if (isSolved()) swapWithBlank(neighbours(game.blank)[0]);

    boardEl.classList.add('no-anim');
    render();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        boardEl.classList.remove('no-anim');
      });
    });
    paintStats();
    showBest();
  }

  function checkWin() {
    if (!isSolved()) return;
    stopTimer();
    game.done = true;
    game.playing = false;
    paintStats();
    var isBest = saveBest();
    winDetail.textContent =
      game.moves + ' 步 · 用时 ' + fmt(elapsed()) + (isBest ? '\n新纪录！' : '');
    winEl.hidden = false;
  }

  function doMove(index) {
    if (game.done) return;
    if (neighbours(game.blank).indexOf(index) === -1) return;
    swapWithBlank(index);
    game.moves += 1;
    if (!game.playing) {
      game.playing = true;
      startTimer();
    }
    render();
    paintStats();
    checkWin();
  }

  // dir 表示「方块往哪个方向滑」，用来支持滑动 / 方向键
  function slide(dir) {
    var n = game.n;
    var b = game.blank;
    var r = Math.floor(b / n);
    var c = b % n;
    var tr = r;
    var tc = c;
    if (dir === 'left') tc = c + 1;
    else if (dir === 'right') tc = c - 1;
    else if (dir === 'up') tr = r + 1;
    else if (dir === 'down') tr = r - 1;
    if (tr < 0 || tc < 0 || tr >= n || tc >= n) return;
    doMove(tr * n + tc);
  }

  /* ---------- 开新局 ---------- */
  function newGame(n) {
    if (n) game.n = n;
    subMax.textContent = String(total() - 1);
    buildTiles();
    resetSolved();
    applyMode();
    render();
    shuffle();
  }

  /* ---------- 交互 ---------- */
  boardEl.addEventListener('click', function (e) {
    var tile = e.target.closest ? e.target.closest('.tile') : null;
    if (!tile) return;
    var v = Number(tile.dataset.value);
    var index = game.place.indexOf(v);
    if (index >= 0) doMove(index);
  });

  var touchStart = null;
  boardEl.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  boardEl.addEventListener('touchmove', function (e) {
    if (touchStart) e.preventDefault();
  }, { passive: false });

  boardEl.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    touchStart = null;
    var ax = Math.abs(dx);
    var ay = Math.abs(dy);
    if (Math.max(ax, ay) < 26) return; // 太小当成点击
    if (ax > ay) slide(dx > 0 ? 'right' : 'left');
    else slide(dy > 0 ? 'down' : 'up');
  });

  boardEl.addEventListener('touchcancel', function () { touchStart = null; });

  document.addEventListener('keydown', function (e) {
    var map = {
      ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
      a: 'left', d: 'right', w: 'up', s: 'down'
    };
    var dir = map[e.key];
    if (!dir) return;
    e.preventDefault();
    slide(dir);
  });

  levelsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-n]');
    if (!btn) return;
    var n = Number(btn.dataset.n);
    if (n === game.n) return;
    [].forEach.call(levelsEl.children, function (b) {
      b.classList.toggle('on', b === btn);
    });
    newGame(n);
  });

  btnShuffle.addEventListener('click', shuffle);
  winAgain.addEventListener('click', shuffle);

  btnMode.addEventListener('click', function () {
    game.pic = !game.pic;
    if (game.pic && !game.imgSrc) game.imgSrc = buildPicture();
    btnMode.textContent = game.pic ? '切数字' : '切图片';
    applyMode();
  });

  newGame(3);
})();
</script>
</body>
</html>
