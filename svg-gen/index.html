<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>随机 SVG 生成器 · Random SVG Art</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080b14;
    --panel: #111726;
    --panel-2: #18202f;
    --line: #26324a;
    --text: #e8eefc;
    --muted: #8d9ab6;
    --accent: #5eead4;
    --accent-2: #a5b4fc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1100px 700px at 12% -10%, #1b2a4a 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 0%, #2a1b45 0%, transparent 55%),
      var(--bg);
    color: var(--text);
  }

  header {
    padding: 26px 24px 6px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: clamp(1.25rem, 2.4vw, 1.7rem);
    margin: 0;
    letter-spacing: .02em;
  }
  h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { margin: 0; color: var(--muted); font-size: .85rem; }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 336px;
    gap: 20px;
    padding: 16px 24px 34px;
    align-items: start;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 12px 14px 28px; }
  }

  .stage {
    position: relative;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: #05070d;
    padding: 14px;
    box-shadow: 0 24px 60px -30px #000;
  }
  .stage-inner {
    border-radius: 12px;
    overflow: hidden;
    background: #05070d;
    line-height: 0;
    min-height: 240px;
    display: grid;
    place-items: center;
  }
  .stage-inner svg { width: 100%; height: auto; display: block; border-radius: 10px; }

  .badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .badge {
    font-size: .74rem;
    letter-spacing: .04em;
    color: var(--muted);
    border: 1px solid var(--line);
    background: var(--panel-2);
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    transition: .18s;
  }
  .badge:hover { color: var(--text); border-color: #3b4a6b; }

  .panel {
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(180deg, #131a2b, #0e1421);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: sticky;
    top: 16px;
  }
  @media (max-width: 900px) { .panel { position: static; } }

  .row { display: flex; gap: 10px; }
  .row > * { min-width: 0; }

  button {
    font: inherit;
    font-size: .88rem;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
    transition: .16s;
  }
  button:hover { border-color: #47597f; background: #1d2739; }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  button.primary {
    background: linear-gradient(135deg, #2dd4bf, #6366f1);
    border-color: transparent;
    color: #07121a;
    font-weight: 650;
    letter-spacing: .02em;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.wide { flex: 1; }

  label.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: .74rem;
    letter-spacing: .06em;
    color: var(--muted);
    text-transform: uppercase;
  }
  input[type="text"], select {
    font: inherit;
    font-size: .88rem;
    color: var(--text);
    background: #0c1220;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 10px;
    width: 100%;
    text-transform: none;
    letter-spacing: 0;
  }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--accent); }

  .switch {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: .84rem;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .switch input { width: 16px; height: 16px; accent-color: #2dd4bf; cursor: pointer; }

  details.code-box {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #0a0f1b;
    overflow: hidden;
  }
  details.code-box summary {
    cursor: pointer;
    padding: 10px 12px;
    font-size: .8rem;
    color: var(--muted);
    letter-spacing: .04em;
  }
  details.code-box summary:hover { color: var(--text); }
  details.code-box pre {
    margin: 0;
    padding: 0 12px 12px;
    max-height: 260px;
    overflow: auto;
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: .72rem;
    line-height: 1.5;
    color: #9fb0d0;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .hint { font-size: .74rem; color: #61708f; line-height: 1.7; }
  kbd {
    font-family: ui-monospace, Consolas, monospace;
    font-size: .72rem;
    background: #1a2334;
    border: 1px solid #2c3950;
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 5px;
    color: #b8c6e0;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 20px);
    background: #101a2b;
    border: 1px solid #2c3950;
    color: var(--text);
    font-size: .84rem;
    padding: 9px 16px;
    border-radius: 999px;
    box-shadow: 0 12px 30px -12px #000;
    opacity: 0;
    pointer-events: none;
    transition: .22s;
    z-index: 20;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header>
  <h1>随机 <span>SVG</span> 图片生成器</h1>
  <p>纯前端生成 · 可复现种子 · 一键导出 SVG / PNG · 元素密集、无大面积纯色（细线网 + 颗粒 + 碎点叠加）· 想按线切开？用 <a href="../svg-cut/index.html" style="color:#5eead4;text-decoration:none;border-bottom:1px dotted currentColor">SVG 线切割工具</a></p>
</header>

<main>
  <section class="stage">
    <div class="stage-inner" id="stage"></div>
    <div class="badges">
      <span class="badge" id="badgeStyle">—</span>
      <span class="badge" id="badgeSeed" title="点击复制种子">种子 —</span>
      <span class="badge" id="badgeSize">—</span>
    </div>
  </section>

  <aside class="panel">
    <button class="primary" id="btnNew">随机生成一张 &nbsp;<span style="opacity:.65">Space</span></button>

    <div class="row">
      <button class="wide" id="btnSvg">下载 SVG</button>
      <button class="wide" id="btnPng">下载 PNG</button>
    </div>
    <div class="row">
      <button class="wide" id="btnCopy">复制源码</button>
    </div>

    <label class="field">
      风格
      <select id="selStyle"></select>
    </label>

    <label class="field">
      尺寸
      <select id="selSize">
        <option value="900x900">正方形 · 900 × 900</option>
        <option value="1200x800">横版 · 1200 × 800</option>
        <option value="800x1200">竖版 · 800 × 1200</option>
        <option value="1080x1080">社交媒体 · 1080 × 1080</option>
        <option value="1600x900">壁纸 · 1600 × 900</option>
      </select>
    </label>

    <label class="field">
      种子（同一 seed 永远生成同一张图）
      <div class="row">
        <input type="text" id="inpSeed" spellcheck="false" placeholder="留空随机" />
        <button id="btnUseSeed" title="使用这个种子">用</button>
      </div>
    </label>

    <label class="switch"><input type="checkbox" id="chkAuto" /> 自动轮播（每 2.5 秒换一张）</label>
    <label class="switch"><input type="checkbox" id="chkGrain" checked /> 纹理叠加（细线网 + 颗粒 + 碎点）</label>

    <details class="code-box">
      <summary>查看 / 展开 SVG 源码</summary>
      <pre id="codeOut"></pre>
    </details>

    <div class="hint">
      <kbd>Space</kbd> 新图 · <kbd>S</kbd> 存 SVG · <kbd>P</kbd> 存 PNG · <kbd>C</kbd> 复制源码<br />
      带 <code>?seed=xxx&amp;style=xxx</code> 的链接可以直接分享同一张图。
    </div>
  </aside>
</main>

<div id="toast"></div>

<script src="gen-core.js"></script>
<script>
(function () {
  'use strict';
  const { buildArt, STYLES, STYLE_KEYS, n1, n2, clamp } = GenCore;

  /* ---------------- 页面逻辑 ---------------- */
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  const badgeStyle = $('badgeStyle');
  const badgeSeed = $('badgeSeed');
  const badgeSize = $('badgeSize');
  const codeOut = $('codeOut');
  const toastEl = $('toast');

  const state = {
    seed: '',
    style: 'random',
    size: '900x900',
    grain: true,
    autoTimer: null,
  };
  let current = null;

  const randomSeed = () => Math.random().toString(36).slice(2, 9);

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  function parseSize(str) {
    const m = /^(\d+)x(\d+)$/.exec(String(str || ''));
    if (!m) return [900, 900];
    return [clamp(parseInt(m[1], 10), 64, 4096), clamp(parseInt(m[2], 10), 64, 4096)];
  }

  function syncUrl() {
    try {
      const q = new URLSearchParams({
        seed: current.seed,
        style: current.styleId,
        size: `${current.W}x${current.H}`,
      });
      history.replaceState(null, '', `${location.pathname}?${q.toString()}`);
    } catch (e) { /* file:// 下浏览器可能拒绝 replaceState，忽略即可 */ }
  }

  function render() {
    if (!state.seed) state.seed = randomSeed();
    current = buildArt({
      seed: state.seed,
      style: state.style,
      size: parseSize(state.size),
      grain: state.grain,
    });
    stage.innerHTML = current.svg;
    badgeStyle.textContent = STYLES[current.styleId].name;
    badgeSeed.textContent = `种子 ${current.seed}`;
    badgeSize.textContent = `${current.W} × ${current.H}`;
    $('inpSeed').value = current.seed;
    codeOut.textContent = current.svg;
    syncUrl();
  }

  function regenerate() {
    state.seed = randomSeed();
    render();
  }

  function saveBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function downloadSvg() {
    if (!current) return;
    saveBlob(new Blob([current.svg], { type: 'image/svg+xml;charset=utf-8' }), `svg-art-${current.seed}.svg`);
    toast('已导出 SVG');
  }

  function downloadPng() {
    if (!current) return;
    const scale = 2;
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = current.W * scale;
      canvas.height = current.H * scale;
      const g = canvas.getContext('2d');
      g.imageSmoothingEnabled = true;
      g.imageSmoothingQuality = 'high';
      g.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => {
        if (!blob) { toast('PNG 导出失败'); return; }
        saveBlob(blob, `svg-art-${current.seed}.png`);
        toast(`已导出 PNG（${canvas.width} × ${canvas.height}）`);
      }, 'image/png');
    };
    img.onerror = () => toast('PNG 导出失败');
    img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(current.svg)}`;
  }

  async function copySvg() {
    if (!current) return;
    try {
      await navigator.clipboard.writeText(current.svg);
      toast('源码已复制');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = current.svg;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('源码已复制'); } catch (err) { toast('复制失败，请手动选择'); }
      ta.remove();
    }
  }

  function setAuto(on) {
    clearInterval(state.autoTimer);
    state.autoTimer = null;
    if (on) state.autoTimer = setInterval(regenerate, 2500);
  }

  /* ---------------- 初始化 ---------------- */
  const selStyle = $('selStyle');
  selStyle.innerHTML = '<option value="random">随机（全部风格混合）</option>' +
    STYLE_KEYS.map((k) => `<option value="${k}">${STYLES[k].name}</option>`).join('');

  const selSize = $('selSize');

  $('btnNew').addEventListener('click', regenerate);
  $('btnSvg').addEventListener('click', downloadSvg);
  $('btnPng').addEventListener('click', downloadPng);
  $('btnCopy').addEventListener('click', copySvg);

  selStyle.addEventListener('change', () => {
    state.style = selStyle.value;
    render();
  });

  selSize.addEventListener('change', () => {
    state.size = selSize.value;
    render();
  });

  $('btnUseSeed').addEventListener('click', () => {
    const val = $('inpSeed').value.trim();
    if (!val) { regenerate(); return; }
    state.seed = val;
    render();
    toast(`已使用种子 ${val}`);
  });

  $('inpSeed').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); $('btnUseSeed').click(); }
  });

  $('chkAuto').addEventListener('change', (e) => {
    setAuto(e.target.checked);
    toast(e.target.checked ? '已开启自动轮播' : '已停止自动轮播');
  });

  $('chkGrain').addEventListener('change', (e) => {
    state.grain = e.target.checked;
    render();
  });

  badgeSeed.addEventListener('click', () => {
    if (!current) return;
    navigator.clipboard.writeText(current.seed)
      .then(() => toast(`种子已复制：${current.seed}`))
      .catch(() => toast(`种子：${current.seed}`));
  });

  document.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'spacebar') { e.preventDefault(); regenerate(); }
    else if (k === 's') { e.preventDefault(); downloadSvg(); }
    else if (k === 'p') { e.preventDefault(); downloadPng(); }
    else if (k === 'c') { e.preventDefault(); copySvg(); }
  });

  // 从 URL 恢复状态
  (function initFromUrl() {
    const params = new URLSearchParams(location.search);
    const style = params.get('style');
    const size = params.get('size');
    const seed = params.get('seed');

    if (style && (style === 'random' || STYLES[style])) {
      state.style = style;
      selStyle.value = style;
    }
    if (size && /^\d+x\d+$/.test(size)) {
      state.size = size;
      if ([...selSize.options].some((o) => o.value === size)) selSize.value = size;
      else {
        const [w, h] = parseSize(size);
        selSize.add(new Option(`${w} × ${h}`, size));
        selSize.value = size;
      }
    }
    state.seed = seed || randomSeed();
  })();

  render();
})();
</script>
</body>
</html>
