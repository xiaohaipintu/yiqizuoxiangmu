<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="拍照拼图还原 · 上传碎片照片，服务器自动拼好" />
<title>拍照拼图还原</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f172a;
    --panel: #1e293b;
    --line: #334155;
    --text: #e2e8f0;
    --dim: #94a3b8;
    --accent1: #38bdf8;
    --accent2: #6366f1;
    --ok: #34d399;
    --err: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 700px at 50% -15%, #1e293b 0%, var(--bg) 62%) fixed;
    color: var(--text);
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
  }
  .app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  h1 {
    margin: 0;
    font-size: clamp(1.2rem, 5vw, 1.7rem);
    text-align: center;
    letter-spacing: .05em;
    background: linear-gradient(120deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { margin: 0; text-align: center; font-size: .78rem; color: var(--dim); }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
  }

  .upload-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 26px 14px;
    border: 2px dashed var(--line);
    border-radius: 16px;
    text-align: center;
  }
  .upload-area.drag { border-color: var(--accent1); background: rgba(56,189,248,.06); }
  .upload-icon { font-size: 2.4rem; line-height: 1; }
  .upload-tip { font-size: .8rem; color: var(--dim); line-height: 1.6; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 20px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
    font-size: .95rem;
    cursor: pointer;
    transition: transform .08s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary {
    border-color: transparent;
    background: linear-gradient(150deg, var(--accent1), var(--accent2));
    color: #fff;
    font-weight: 600;
  }
  .btn[disabled] { opacity: .5; }
  .btn input[type="file"] { display: none; }

  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .label { font-size: .8rem; color: var(--dim); }
  .seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; }
  .seg button {
    min-height: 34px; min-width: 48px;
    border: 0; border-radius: 8px; background: transparent;
    color: var(--dim); font-family: inherit; font-size: .82rem; cursor: pointer;
  }
  .seg button.on { background: var(--line); color: #fff; font-weight: 600; }

  .progress { display: flex; flex-direction: column; gap: 8px; }
  .bar { height: 8px; border-radius: 999px; background: #0b1220; overflow: hidden; }
  .bar span {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    transition: width .4s ease;
  }
  .progress-text { display: flex; justify-content: space-between; font-size: .8rem; color: var(--dim); }
  .steps-log {
    font-size: .72rem; color: #64748b; line-height: 1.7;
    max-height: 92px; overflow: auto; white-space: pre-wrap;
    font-family: ui-monospace, Consolas, monospace;
  }

  .result-img {
    width: 100%;
    border-radius: 12px;
    display: block;
    background: #fff;
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair figure { margin: 0; }
  .pair figcaption { font-size: .72rem; color: var(--dim); text-align: center; margin-top: 4px; }
  .metrics { display: flex; gap: 8px; margin-top: 10px; }
  .metric {
    flex: 1; text-align: center; padding: 8px 4px;
    background: #0b1220; border: 1px solid var(--line); border-radius: 10px;
  }
  .metric b { display: block; font-size: 1rem; font-variant-numeric: tabular-nums; }
  .metric em { font-style: normal; font-size: .68rem; color: var(--dim); }
  .good { color: var(--ok); }
  .bad { color: var(--err); }

  .error-box {
    border: 1px solid rgba(248,113,113,.4);
    background: rgba(248,113,113,.08);
    color: #fecaca;
    border-radius: 12px;
    padding: 12px;
    font-size: .82rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  details summary {
    cursor: pointer; font-size: .8rem; color: var(--dim);
    padding: 6px 0; list-style: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: '▸ '; }
  details[open] summary::before { content: '▾ '; }

  .hidden { display: none !important; }
  .footer { text-align: center; font-size: .7rem; color: #475569; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>拍照拼图还原</h1>
    <p class="sub">拍一张碎片散落的照片 → 服务器自动拼回完整图形</p>
  </header>

  <!-- 1. 上传 -->
  <section class="card" id="step-upload">
    <div class="upload-area" id="drop-zone">
      <div class="upload-icon">📷</div>
      <div class="upload-tip">
        拍一张「碎片散落在纯色背景上」的照片<br />
        背景越干净、碎片之间不重叠，成功率越高
      </div>
      <label class="btn primary">
        选择照片 / 拍照
        <input type="file" id="file" accept="image/*" />
      </label>
    </div>

    <div class="row" style="margin-top: 12px;">
      <span class="label">搜索时长</span>
      <div class="seg" id="time-seg">
        <button type="button" data-t="15">15s</button>
        <button type="button" data-t="30">30s</button>
        <button type="button" data-t="45" class="on">45s</button>
        <button type="button" data-t="90">90s</button>
      </div>
    </div>
    <div class="row" style="margin-top: 8px;">
      <span class="label">有凹形碎片（弯边/缺角）</span>
      <div class="seg" id="concave-seg">
        <button type="button" data-v="1" class="on">是</button>
        <button type="button" data-v="0">否</button>
      </div>
    </div>
  </section>

  <!-- 2. 进度 -->
  <section class="card progress hidden" id="step-progress">
    <div class="progress-text">
      <span id="prog-step">上传中…</span>
      <span id="prog-time">0s</span>
    </div>
    <div class="bar"><span id="prog-bar"></span></div>
    <div class="steps-log" id="prog-log"></div>
  </section>

  <!-- 3. 错误 -->
  <section class="card hidden" id="step-error">
    <div class="error-box" id="error-text"></div>
    <button class="btn primary" id="btn-retry" style="width:100%;margin-top:12px;">重新来一张</button>
  </section>

  <!-- 4. 结果 -->
  <section class="hidden" id="step-result">
    <div class="card">
      <div class="pair" id="pair-box">
        <figure>
          <img class="result-img" id="img-upload" alt="原图" />
          <figcaption>你拍的照片</figcaption>
        </figure>
        <figure>
          <img class="result-img" id="img-assembled" alt="拼好的图" />
          <figcaption>拼好的图</figcaption>
        </figure>
      </div>
      <div class="metrics">
        <div class="metric"><b id="m-pieces">-</b><em>碎片数</em></div>
        <div class="metric"><b id="m-holes">-</b><em>空洞率</em></div>
        <div class="metric"><b id="m-overlap">-</b><em>重叠率</em></div>
        <div class="metric"><b id="m-time">-</b><em>耗时</em></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <a class="btn primary" id="btn-download" style="flex:1;text-decoration:none;" download="拼好的图.jpg">保存拼好的图</a>
        <button class="btn" id="btn-again" style="flex:1;">再来一张</button>
      </div>
    </div>

    <div class="card" style="margin-top:12px;">
      <details>
        <summary>查看候选排名图 / 原始分割结果</summary>
        <img class="result-img" id="img-rank" alt="候选排名" style="margin-top:8px;" />
        <img class="result-img" id="img-mask" alt="分割掩膜" style="margin-top:8px;" />
      </details>
    </div>
  </section>

  <p class="footer">局域网内使用 · 服务器：拼图还原项目/web</p>
</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var stepUpload = $('step-upload');
  var stepProgress = $('step-progress');
  var stepError = $('step-error');
  var stepResult = $('step-result');
  var dropZone = $('drop-zone');
  var fileInput = $('file');

  var beamTime = 45;
  var concave = '1';
  var polling = null;
  var startedAt = 0;

  // ---------- 参数选择 ----------
  $('time-seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-t]');
    if (!b) return;
    beamTime = Number(b.dataset.t);
    [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
  });
  $('concave-seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-v]');
    if (!b) return;
    concave = b.dataset.v;
    [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
  });

  // ---------- 前端压缩：长边限到 2000px，减少上传时间 ----------
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      if (!/^image\//.test(file.type)) { reject(new Error('请选择图片文件')); return; }
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 2000;
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, max / Math.max(w, h));
        var cv = document.createElement('canvas');
        cv.width = Math.round(w * scale);
        cv.height = Math.round(h * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function (blob) {
          blob ? resolve(blob) : reject(new Error('图片处理失败'));
        }, 'image/jpeg', 0.92);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
      img.src = url;
    });
  }

  // ---------- 上传 + 轮询 ----------
  function show(which) {
    stepUpload.classList.toggle('hidden', which !== 'upload');
    stepProgress.classList.toggle('hidden', which !== 'progress');
    stepError.classList.toggle('hidden', which !== 'error');
    stepResult.classList.toggle('hidden', which !== 'result');
  }

  function fail(msg) {
    if (polling) { clearInterval(polling); polling = null; }
    $('error-text').textContent = msg;
    show('error');
  }

  function tickTimer() {
    var s = Math.floor((Date.now() - startedAt) / 1000);
    $('prog-time').textContent = s + 's';
  }

  function startJob(blob) {
    show('progress');
    startedAt = Date.now();
    $('prog-step').textContent = '上传中…';
    $('prog-bar').style.width = '4%';
    $('prog-log').textContent = '';
    var timer = setInterval(tickTimer, 500);

    fetch('/api/solve', {
      method: 'POST',
      headers: {
        'Content-Type': 'image/jpeg',
        'X-Beam-Time': String(beamTime),
        'X-Concave': concave
      },
      body: blob
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j.error || '上传失败');
        $('prog-step').textContent = '已上传，排队中…';
        poll(res.j.id, timer);
      })
      .catch(function (err) {
        clearInterval(timer);
        fail(err.message || '上传失败，检查是否和电脑在同一个 Wi-Fi');
      });
  }

  function poll(jobId, timer) {
    var lastStatus = '';
    polling = setInterval(function () {
      fetch('/api/job?id=' + encodeURIComponent(jobId))
        .then(function (r) { return r.json(); })
        .then(function (job) {
          if (job.error && job.status !== 'error') throw new Error(job.error);
          $('prog-step').textContent = job.step || job.status;
          $('prog-bar').style.width = Math.max(4, job.progress || 0) + '%';
          if (job.log && job.log.length) {
            $('prog-log').textContent = job.log.slice(-8).join('\n');
          }
          if (job.status === 'done') {
            clearInterval(polling); polling = null;
            clearInterval(timer);
            showResult(jobId, job.result);
          } else if (job.status === 'error') {
            clearInterval(polling); polling = null;
            clearInterval(timer);
            fail(humanize(job.error || '拼合失败'));
          }
          lastStatus = job.status;
        })
        .catch(function (err) {
          clearInterval(polling); polling = null;
          clearInterval(timer);
          fail(err.message || '连接中断');
        });
    }, 1200);
  }

  function humanize(msg) {
    if (/只找到|没有可区分/.test(msg)) return '照片里没识别出碎片。\n建议：碎片放在纯色（绿/白）背景上，不要互相压住，光线均匀不反光。';
    if (/没有找到任何拼法/.test(msg)) return '找到了碎片，但没搜出拼法。\n建议：把「搜索时长」调到 90s 再试，或确认碎片没有互相遮挡。';
    if (/读不到图片|无法识别/.test(msg)) return '图片读不出来，换一张 JPG/PNG 试试。';
    return msg;
  }

  function showResult(jobId, result) {
    var base = '/api/file?id=' + encodeURIComponent(jobId) + '&n=';
    $('img-upload').src = base + 'upload.jpg';
    $('img-assembled').src = base + 'assembled.jpg';
    $('img-rank').src = base + '41_union_rank.png';
    $('img-mask').src = base + '01_mask.png';
    $('btn-download').href = base + 'assembled.jpg';

    var m = result.metrics || {};
    $('m-pieces').textContent = result.pieces;
    var holes = typeof m.holes_pct === 'number' ? m.holes_pct : null;
    var ov = typeof m.overlap_pct === 'number' ? m.overlap_pct : null;
    var hEl = $('m-holes');
    var oEl = $('m-overlap');
    hEl.textContent = holes === null ? '-' : holes.toFixed(2) + '%';
    oEl.textContent = ov === null ? '-' : ov.toFixed(2) + '%';
    hEl.className = holes !== null && holes < 3 ? 'good' : 'bad';
    oEl.className = ov !== null && ov < 3 ? 'good' : 'bad';
    $('m-time').textContent = (result.steps && result.steps.total ? result.steps.total : 0) + 's';
    show('result');
  }

  // ---------- 入口 ----------
  function handleFile(file) {
    if (!file) return;
    fileInput.value = '';
    shrink(file).then(startJob).catch(function (e) { fail(e.message); });
  }

  fileInput.addEventListener('change', function () {
    handleFile(fileInput.files && fileInput.files[0]);
  });

  ['dragenter', 'dragover'].forEach(function (t) {
    dropZone.addEventListener(t, function (e) { e.preventDefault(); dropZone.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    dropZone.addEventListener(t, function () { dropZone.classList.remove('drag'); });
  });
  dropZone.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    handleFile(f);
  });

  function reset() {
    if (polling) { clearInterval(polling); polling = null; }
    $('img-upload').src = ''; $('img-assembled').src = '';
    show('upload');
  }
  $('btn-retry').addEventListener('click', reset);
  $('btn-again').addEventListener('click', reset);
})();
</script>
</body>
</html>
