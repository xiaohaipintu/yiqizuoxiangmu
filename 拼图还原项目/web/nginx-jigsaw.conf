# 拼图还原（拍照拼图）子页 —— 反代到本机 systemd 服务 127.0.0.1:8099
# 对外地址：https://wildyouth.cn/jigsaw/
# 放置位置：/etc/nginx/snippets/jigsaw.conf
# 挂载方式：在 /etc/nginx/sites-available/wild-youth 的 HTTPS server 块里加一行
#              include /etc/nginx/snippets/jigsaw.conf;
location /jigsaw/ {
    proxy_pass http://127.0.0.1:8099/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 手机原图可能有几 MB；拼合任务最长 ~150s，代理别提前掐断
    client_max_body_size 25m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location = /jigsaw { return 301 /jigsaw/; }
