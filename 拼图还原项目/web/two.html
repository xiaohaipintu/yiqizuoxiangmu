<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>两片拼合 · 手撕照片</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;
    background:#12131a;color:#e6e6ee;display:flex;flex-direction:column;align-items:center;padding:18px;gap:14px}
  h1{font-size:18px;margin:4px 0}
  .sub{color:#8b8b96;font-size:13px;text-align:center;line-height:1.6;max-width:640px}
  .card{background:#1c1d26;border:1px solid #2c2d38;border-radius:12px;padding:16px;width:100%;max-width:900px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  label.btn{background:#5ee7c4;color:#10131a;font-weight:700;padding:9px 16px;border-radius:8px;cursor:pointer}
  button{background:#2c2d38;color:#e6e6ee;border:1px solid #3a3b46;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px}
  button.primary{background:#5ee7c4;color:#10131a;border:none;font-weight:700}
  input[type=file]{display:none}
  .status{color:#8b8b96;font-size:13px;min-height:20px}
  .grid{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:12px}
  .box{flex:1;min-width:260px;text-align:center}
  .box img{max-width:100%;border-radius:8px;background:#0e0f14;border:1px solid #2c2d38}
  .cap{color:#9aa;font-size:12px;margin:6px 0}
  .err{color:#ff8a8a}
  .tag{display:inline-block;background:#26313a;color:#5ee7c4;border-radius:6px;padding:2px 8px;margin:2px;font-size:12px}
</style>
</head>
<body>
  <h1>两片手撕照片 · 自动拼合</h1>
  <div class="sub">上传一张「<b>正好两片</b>手撕纸、放在纯色背景上」的照片 → 自动裁出两片 → 依「边长 + 贴合覆盖率」自动判断该拼哪两条边 → 拼合并去掉背景。</div>

  <div class="card">
    <div class="row">
      <label class="btn">选择照片<input id="file" type="file" accept="image/*"></label>
      <button id="go" class="primary" disabled>拼合</button>
      <span class="status" id="status">请选择一张两片的照片</span>
    </div>
    <div class="grid">
      <div class="box"><div class="cap">抠图预览（分割出的碎片）</div><div id="prev"></div></div>
      <div class="box"><div class="cap">拼合结果</div><div id="joined"></div></div>
    </div>
    <div id="info" style="margin-top:10px;text-align:center"></div>
  </div>

<script>
  var f=document.getElementById('file'), go=document.getElementById('go'),
      st=document.getElementById('status'), prev=document.getElementById('prev'),
      joined=document.getElementById('joined'), info=document.getElementById('info');
  var blob=null;
  f.onchange=function(){ var x=f.files[0]; if(!x){go.disabled=true;return;} blob=x;
    st.textContent='已选：'+x.name+'（点“拼合”）'; go.disabled=false;
    prev.innerHTML=''; joined.innerHTML=''; info.innerHTML=''; };
  go.onclick=async function(){
    if(!blob) return;
    go.disabled=true; st.textContent='处理中…分割+拼合，可能要几十秒'; prev.innerHTML=''; joined.innerHTML=''; info.innerHTML='';
    try{
      var r=await fetch('api/two',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:blob});
      var j=await r.json();
      if(j.preview_png){ prev.innerHTML='<img src="data:image/png;base64,'+j.preview_png+'">'; }
      if(j.ok){
        st.textContent='完成';
        joined.innerHTML='<img src="data:image/png;base64,'+j.joined_png+'">';
        info.innerHTML='<span class="tag">拼接边 '+j.edges+'</span>'+
          '<span class="tag">贴合点 '+j.contact+'</span>'+
          '<span class="tag">覆盖率 '+j.coverage_pct+'%</span>'+
          '<span class="tag">重叠 '+j.overlap_pct+'%</span>';
      } else {
        st.textContent='未拼合';
        info.innerHTML='<span class="err">'+ (j.error||'失败') +'</span>';
      }
    }catch(e){ st.textContent='出错：'+e; }
    go.disabled=false;
  };
</script>
</body>
</html>
